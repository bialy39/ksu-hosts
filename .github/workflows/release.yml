name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalacja zip i busybox
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox-static zip unzip

      - name: Testy przed wydaniem
        run: busybox ash tests/run-tests.sh

      - name: Budowanie zipa
        run: sh build.sh

      - name: Publikacja wydania
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ksu-hosts-*.zip
          generate_release_notes: true
          body: |
            Moduł systemless `hosts` dla KernelSU / KernelSU-Next.

            Instalacja: menedżer KernelSU → Moduły → Zainstaluj z pliku → restart.
            Szczegóły i weryfikacja: [README](https://github.com/${{ github.repository }}#readme)
